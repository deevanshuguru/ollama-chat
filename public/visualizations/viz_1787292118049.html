<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Sales</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
      text-align: center;
      font-size: 24px;
    }
    .chart-container {
      position: relative;
      height: 500px;
      width: 100%;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #667eea;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }
      h1 {
        font-size: 18px;
      }
      .chart-container {
        height: 300px;
      }
      .stats {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Monthly Sales</h1>
    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>
    <div class="stats" id="stats"></div>
    <div class="footer">
      🚀 Generated by Local AI Labs | Powered by Chart.js
    </div>
  </div>

  <script>
    const config = {"type":"pie","data":{"labels":["Jan","Feb","Mar","Apr"],"datasets":[{"label":"Data","data":[100,150,200,180],"backgroundColor":["#FF6384","#36A2EB","#FFCE56","#4BC0C0"],"borderColor":"#fff","borderWidth":2}]},"options":{"responsive":true,"maintainAspectRatio":false,"plugins":{"title":{"display":true,"text":"Monthly Sales","font":{"size":18}},"legend":{"display":true,"position":"top"}}}};
    const ctx = document.getElementById('chart');
    const chart = new Chart(ctx, config);

    // Calculate statistics
    const data = config.data.datasets[0].data;
    const numericData = Array.isArray(data)
      ? data.filter(v => typeof v === 'number')
      : data.map(d => d.y || d.x).filter(v => typeof v === 'number');

    if (numericData.length > 0) {
      const sum = numericData.reduce((a, b) => a + b, 0);
      const avg = sum / numericData.length;
      const max = Math.max(...numericData);
      const min = Math.min(...numericData);

      document.getElementById('stats').innerHTML = `
        <div class="stat">
          <div class="stat-value">${numericData.length}</div>
          <div class="stat-label">Data Points</div>
        </div>
        <div class="stat">
          <div class="stat-value">${avg.toFixed(2)}</div>
          <div class="stat-label">Average</div>
        </div>
        <div class="stat">
          <div class="stat-value">${max}</div>
          <div class="stat-label">Maximum</div>
        </div>
        <div class="stat">
          <div class="stat-value">${min}</div>
          <div class="stat-label">Minimum</div>
        </div>
      `;
    }
  </script>
</body>
</html>
